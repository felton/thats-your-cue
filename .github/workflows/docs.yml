name: Docs

# Deploys the docs site (docs/) to GitHub Pages on pushes to main that touch it.
# PRs are checked by ci.yml's docs job instead, so nothing here can be a
# required check that never runs. Needs Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs.yml"]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from the "packageManager" field in package.json
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: docs/.nvmrc
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Checked again so a broken main never deploys.
      - run: pnpm check
      - run: pnpm build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
